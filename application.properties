server.port=8080
# Base de datos local (H2 en archivo ./data). Para PostgreSQL cambie url, driver y dependencia.
spring.datasource.url=jdbc:h2:file:./data/esfap;AUTO_SERVER=TRUE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
# Sesión: cierre por inactividad y cookie protegida
server.servlet.session.timeout=5m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
# En producción con HTTPS: COOKIE_SECURE=true (y FORWARD_HEADERS=native si hay proxy inverso, para ver IP y esquema reales)
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.forward-headers-strategy=${FORWARD_HEADERS:none}
# Subida de documentos (mesa de partes)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=16MB
# No revelar detalles internos en errores
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
# Datos de demostración (secciones, estudiantes ficticios, notas, asistencias, cuotas). En producción: false
portal.seed-demo=${SEED_DEMO:true}

# ===== LABORATORIO DE CIBERSEGURIDAD =====
# false por defecto. Para el laboratorio: LAB_VULN=true (solo en localhost, datos ficticios).
portal.lab-vulnerable=${LAB_VULN:false}
